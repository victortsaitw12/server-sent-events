<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>SSE 課程 - Step 4：多客戶端廣播</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Step 4：多客戶端廣播</h1>
  <p>
    打開<strong>兩個以上的瀏覽器分頁</strong>連到這個頁面，在任何一個分頁送出訊息，
    所有分頁都會「同時」收到——這就是 SSE 用來做一對多推播（例如聊天室通知、
    儀表板即時更新）的典型場景。
  </p>

  <p>連線狀態：<span id="status">尚未連線</span>　目前在線：<span id="online">-</span> 人</p>

  <div class="chat-input">
    <input id="text" type="text" placeholder="輸入訊息後按 Enter 或送出" />
    <button id="send">送出</button>
  </div>

  <h2>廣播訊息</h2>
  <ul id="messages"></ul>

  <script src="app.js"></script>
</body>
</html>
