<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>SSE 課程 - Step 5：心跳與斷線清理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Step 5：心跳與斷線清理</h1>
  <p>
    延續 Step 4 的多人聊天室，這一步加上每 15 秒一次的心跳（維持連線不被反向代理
    當成閒置關閉）與更完整的斷線清理。心跳本身在畫面上看不到——用瀏覽器開發者工具
    的 Network 面板，或下方「動手試試看」的 curl 指令觀察最原始的資料流才看得到。
  </p>

  <p>連線狀態：<span id="status">尚未連線</span>　目前在線：<span id="online">-</span> 人</p>

  <div class="chat-input">
    <input id="text" type="text" placeholder="輸入訊息後按 Enter 或送出" />
    <button id="send">送出</button>
  </div>

  <h2>廣播訊息</h2>
  <ul id="messages"></ul>

  <script src="app.js"></script>
</body>
</html>
